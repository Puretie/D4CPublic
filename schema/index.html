<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build Guide JSON Schema</title>
    <style>
      :root {
        --bg: #151210;
        --panel: #211d19;
        --panel-soft: #2a241f;
        --border: #3a3028;
        --border-strong: #5f4b36;
        --heading: #fff4df;
        --text: #d7c9b4;
        --muted: #9b8d79;
        --gold: #e2b15f;
        --red: #b84238;

        font: 16px/1.55 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          linear-gradient(90deg, rgba(184, 66, 56, 0.11), transparent 32%),
          linear-gradient(180deg, #1b1714 0%, var(--bg) 430px);
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        padding: 34px 0 26px;
        border-bottom: 1px solid var(--border);
      }

      p {
        margin: 0;
      }

      .eyebrow,
      .status {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 8px 0 10px;
        color: var(--heading);
        font-size: clamp(32px, 5vw, 48px);
        line-height: 1.04;
        letter-spacing: 0;
      }

      .intro {
        max-width: 760px;
        color: var(--text);
        font-size: 18px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }

      button,
      a.button {
        min-height: 40px;
        padding: 9px 14px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        color: var(--heading);
        background: var(--panel);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover,
      a.button:hover,
      button:focus-visible,
      a.button:focus-visible {
        border-color: var(--gold);
        outline: none;
      }

      .schema-panel {
        margin-top: 28px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }

      pre {
        margin: 0;
        padding: 22px;
        overflow: auto;
        color: var(--text);
        font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .status {
        min-height: 24px;
        margin-top: 12px;
      }

      .error {
        color: #f6a39d;
      }

      @media (max-width: 700px) {
        main {
          width: min(100% - 24px, 680px);
          padding-top: 22px;
        }

        header {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Diablo IV Build Planner</p>
          <h1>Build Guide JSON Schema</h1>
          <p class="intro">
            Canonical schema for static build guide JSON consumed by the planner
            and future compendium scripts.
          </p>
        </div>
        <div class="actions">
          <button id="copy-button" type="button">Copy</button>
          <a class="button" href="./build-guide.schema.json">Raw JSON</a>
        </div>
      </header>

      <p id="status" class="status" role="status">Loading schema...</p>
      <section class="schema-panel" aria-label="Build guide JSON schema">
        <pre id="schema-output">Loading...</pre>
      </section>
    </main>

    <script>
      const schemaOutput = document.querySelector("#schema-output");
      const status = document.querySelector("#status");
      const copyButton = document.querySelector("#copy-button");
      let schemaText = "";

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return;
          } catch {
            // Fall through to the textarea fallback below.
          }
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }

      async function loadSchema() {
        try {
          const response = await fetch("./build-guide.schema.json", {
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error(`Schema request failed with ${response.status}`);
          }

          const schema = await response.json();
          schemaText = JSON.stringify(schema, null, 2);
          schemaOutput.textContent = schemaText;
          status.textContent = "Schema loaded.";
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          status.textContent = message;
          status.classList.add("error");
          schemaOutput.textContent = "Unable to load build-guide.schema.json.";
        }
      }

      copyButton.addEventListener("click", async () => {
        if (!schemaText) {
          return;
        }

        try {
          await copyText(schemaText);
          status.textContent = "Schema copied.";
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          status.textContent = `Copy failed: ${message}`;
          status.classList.add("error");
        }
      });

      loadSchema();
    </script>
  </body>
</html>
